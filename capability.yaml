name: LangeVC/txt-humanizer
version: 0.4.0
kind: skill
description: "Modulares, mehrsprachiges und varietätensensitives KI-Erkennungs- und Humanisierungs-Framework inkl. CLI für Terminal & CI/CD."
long_description: >
  Modulares, mehrsprachiges und varietätensensitives Erkennungs- und
  Humanisierungs-Framework. Erkennt und entfernt KI-Muster evidenzbasiert nach
  den aktuellen Kriterien von Wikipedia DE (Anzeichen für KI-generierte Inhalte)
  und Wikipedia EN (Signs of AI writing / WP:AISIGNS).
  Unterstützt Standardvarietäten (de-DE, de-AT, de-CH, en-US, en-GB),
  erkennt dialektale Human Signals und schützt vor False Positives.
  Bietet eine vollwertige CLI für Terminal-Usability und CI/CD-Pipelines.
