name: LangeVC/txt-humanizer
version: 0.5.0
kind: skill
description: "Modulares, 7-sprachiges und varietätensensitives KI-Erkennungs- und Humanisierungs-Framework inkl. CLI für Terminal & CI/CD."
long_description: >
  Modulares, mehrsprachiges und varietätensensitives Erkennungs- und
  Humanisierungs-Framework für 7 Sprachen (DE, EN, FR, ES, IT, PT, VI).
  Erkennt und entfernt KI-Muster evidenzbasiert nach Wikipedia-Kriterien.
  Unterstützt Standardvarietäten (de-DE, de-AT, de-CH, en-US, en-GB, fr-CA, es-MX, es-AR, pt-BR, pt-PT, vi-Central, vi-South),
  erkennt dialektale Human Signals und schützt vor False Positives.
  Bietet eine vollwertige CLI mit Review-Modus, Pre-Commit-Plugin und Multicore-Scanner.
author: LangeVC
