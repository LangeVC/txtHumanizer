name: Release

on:
  push:
    tags: ['v*']

jobs:
  validate:
    # GitHub-only: never runs on the Forgejo mirror side.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Capacium/capacium-action-validate@v1
        with:
          manifest-path: capability.yaml
          strict-mode: 'true'
          sync-version: 'true'

  build:
    needs: validate
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create tarball
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          TARBALL="txtHumanizer-v${VERSION}.tar.gz"
          mkdir -p dist
          tar -czf "dist/${TARBALL}" \
            --transform "s,^\.,txtHumanizer-v${VERSION}," \
            SKILL.md README.md capability.yaml LICENSE
          echo "TARBALL=${TARBALL}" >> $GITHUB_ENV
          echo "TARBALL_PATH=dist/${TARBALL}" >> $GITHUB_ENV
      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: txtHumanizer-release
          path: ${{ env.TARBALL_PATH }}
      - name: Upload to GitHub Release
        # Create the GitHub release from the mirrored tag and attach the tarball.
        # Tags originate on Forgejo (canonical); this never creates tags or commits.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.TARBALL_PATH }}
          name: txtHumanizer ${{ github.ref_name }}
          generate_release_notes: true

  publish:
    needs: build
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Capacium/capacium-action-publish@v1
