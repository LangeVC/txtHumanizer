name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    # GitHub-only: never runs on the Forgejo mirror side.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Capacium/capacium-action-validate@v1
        with:
          manifest-path: capability.yaml
          strict-mode: 'true'
          sync-version: 'true'

  build:
    needs: validate
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create tarball
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          TARBALL="txtHumanizer-v${VERSION}.tar.gz"
          mkdir -p dist
          tar -czf "dist/${TARBALL}" \
            --transform "s,^\.,txtHumanizer-v${VERSION}," \
            SKILL.md README.md capability.yaml LICENSE CHANGELOG.md setup.py bin catalog txthumanizer
          echo "TARBALL=${TARBALL}" >> $GITHUB_ENV
          echo "TARBALL_PATH=dist/${TARBALL}" >> $GITHUB_ENV
      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: txtHumanizer-release
          path: ${{ env.TARBALL_PATH }}

  # No step in this workflow creates or edits a GitHub release object: the engine
  # owns the release, its body and its destinations (RFL-016). This workflow builds
  # and uploads an Actions artifact only; it never writes a tag, commit or release.

  publish:
    needs: build
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: Capacium/capacium-action-publish@v1
        with:
          use_oidc: 'true'
